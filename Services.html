<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adelin.com — Digital tools for Nairobi businesses</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap');

:root{
  --ink:#14181C;
  --paper:#F5F2EA;
  --paper-2:#EEE9DC;
  --brass:#A6742E;
  --teal:#1F3B36;
  --rust:#8B3A2B;
  --line:#D9D2C1;
  --muted:#5B5A52;
}

*{margin:0;padding:0;box-sizing:border-box;}

html{scroll-behavior:smooth;}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

.serif{font-family:'Fraunces',serif;}

a{color:inherit;text-decoration:none;}

img{max-width:100%;display:block;}

.wrap{
  max-width:1120px;
  margin:0 auto;
  padding:0 32px;
}

@media(max-width:640px){
  .wrap{padding:0 20px;}
}

/* Header */
header{
  padding:28px 0;
  border-bottom:1px solid var(--line);
}
header .wrap{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.wordmark{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:22px;
  letter-spacing:-0.01em;
}
.wordmark span{color:var(--brass);}
nav{display:flex;gap:36px;font-size:14px;}
nav a{color:var(--muted);transition:color .15s;}
nav a:hover{color:var(--ink);}
.nav-toggle{display:none;}

@media(max-width:640px){
  nav{display:none;}
}

/* Hero */
.hero{
  padding:88px 0 96px;
  border-bottom:1px solid var(--line);
}
.hero-grid{
  display:grid;
  grid-template-columns:1.3fr 1fr;
  gap:64px;
  align-items:end;
}
@media(max-width:860px){
  .hero-grid{grid-template-columns:1fr;gap:48px;}
}
.eyebrow{
  font-size:13px;
  color:var(--brass);
  margin-bottom:20px;
  font-weight:500;
}
.hero h1{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:clamp(36px,5.2vw,58px);
  line-height:1.08;
  letter-spacing:-0.01em;
  max-width:12ch;
}
.hero p.lede{
  margin-top:24px;
  font-size:18px;
  color:var(--muted);
  max-width:42ch;
}
.hero-cta{
  margin-top:32px;
  display:flex;
  gap:16px;
  flex-wrap:wrap;
}
.btn{
  display:inline-block;
  padding:13px 26px;
  font-size:14px;
  font-weight:500;
  border-radius:2px;
}
.btn-primary{
  background:var(--ink);
  color:var(--paper);
}
.btn-primary:hover{background:var(--teal);}
.btn-secondary{
  border:1px solid var(--ink);
  color:var(--ink);
}
.btn-secondary:hover{background:var(--ink);color:var(--paper);}

.index-list{
  border-top:1px solid var(--line);
}
.index-row{
  display:flex;
  gap:18px;
  padding:16px 0;
  border-bottom:1px solid var(--line);
  font-size:14.5px;
}
.index-row .num{
  font-family:'Fraunces',serif;
  color:var(--brass);
  font-size:14px;
  width:20px;
  flex-shrink:0;
}
.index-row .label{color:var(--muted);}

/* Section shared */
section{padding:88px 0;}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:24px;
  margin-bottom:56px;
  border-bottom:1px solid var(--line);
  padding-bottom:24px;
}
.section-head h2{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:clamp(28px,3.4vw,38px);
  letter-spacing:-0.01em;
}
.section-head .tag{
  font-size:13px;
  color:var(--muted);
  max-width:28ch;
  text-align:right;
}
@media(max-width:640px){
  .section-head{flex-direction:column;align-items:flex-start;}
  .section-head .tag{text-align:left;}
}

/* Services */
.service-row{
  display:grid;
  grid-template-columns:60px 1fr 1.3fr;
  gap:32px;
  padding:32px 0;
  border-bottom:1px solid var(--line);
  align-items:baseline;
}
.service-row:first-of-type{border-top:1px solid var(--line);}
.service-row .num{
  font-family:'Fraunces',serif;
  font-style:italic;
  color:var(--brass);
  font-size:20px;
}
.service-row h3{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:22px;
}
.service-row p{
  color:var(--muted);
  font-size:15px;
  max-width:52ch;
}
@media(max-width:760px){
  .service-row{grid-template-columns:32px 1fr;}
  .service-row p{grid-column:2/3;}
}

/* About / founder */
.about{
  background:var(--paper-2);
}
.about-grid{
  display:grid;
  grid-template-columns:0.85fr 1.15fr;
  gap:64px;
  align-items:start;
}
@media(max-width:860px){
  .about-grid{grid-template-columns:1fr;gap:36px;}
}
.founder-photo-wrap{
  border:1px solid var(--ink);
  padding:10px;
}
.founder-photo{
  width:100%;
  display:block;
  filter:grayscale(100%) contrast(1.05);
}
.founder-caption{
  display:flex;
  justify-content:space-between;
  padding-top:12px;
  font-size:12.5px;
  color:var(--muted);
  border-top:1px solid var(--line);
  margin-top:12px;
}
.about-copy h2{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:clamp(26px,3.2vw,34px);
  margin-bottom:24px;
  max-width:16ch;
}
.about-copy p{
  color:var(--muted);
  margin-bottom:18px;
  max-width:56ch;
}
.about-copy p strong{color:var(--ink);font-weight:600;}
.goals{
  margin-top:32px;
  display:flex;
  gap:28px;
  flex-wrap:wrap;
  border-top:1px solid var(--line);
  padding-top:24px;
}
.goals div{
  font-size:12.5px;
  color:var(--brass);
  font-weight:500;
  letter-spacing:0.02em;
}

/* Course strip */
.course{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.course-grid{
  display:grid;
  grid-template-columns:1fr auto;
  gap:32px;
  align-items:center;
}
@media(max-width:640px){
  .course-grid{grid-template-columns:1fr;align-items:start;}
}
.course h3{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:26px;
  margin-bottom:10px;
}
.course p{color:var(--muted);max-width:48ch;}
.price{
  font-family:'Fraunces',serif;
  font-size:32px;
  white-space:nowrap;
}
.price span{font-size:14px;color:var(--muted);font-family:'Inter',sans-serif;}

/* Payment strip */
.pay-strip{
  display:flex;
  gap:48px;
  flex-wrap:wrap;
  padding-top:32px;
  border-top:1px solid var(--line);
}
.pay-item{font-size:13.5px;color:var(--muted);}
.pay-item strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;}

/* Contact */
.contact{
  background:var(--ink);
  color:var(--paper);
}
.contact h2{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:clamp(30px,4vw,46px);
  max-width:14ch;
  margin-bottom:28px;
}
.contact-grid{
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:48px;
}
@media(max-width:860px){
  .contact-grid{grid-template-columns:1fr;}
}
.contact-links{border-top:1px solid rgba(245,242,234,0.2);}
.contact-links a{
  display:flex;
  justify-content:space-between;
  padding:18px 0;
  border-bottom:1px solid rgba(245,242,234,0.2);
  font-size:15px;
  transition:opacity .15s;
}
.contact-links a:hover{opacity:0.6;}
.contact-links a .arrow{color:var(--brass);}

footer{
  padding:24px 0;
  font-size:12.5px;
  color:var(--muted);
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
}
@media(max-width:640px){
  footer{flex-direction:column;gap:6px;}
}

/* Scroll reveal — one consistent treatment, applied per section */
.reveal{
  opacity:0;
  transform:translateY(18px);
  transition:opacity .7s cubic-bezier(.2,.6,.2,1), transform .7s cubic-bezier(.2,.6,.2,1);
}
.reveal.is-visible{
  opacity:1;
  transform:translateY(0);
}

/* Section accent rule — draws in on scroll, colored per section */
.accent-rule{
  height:2px;
  width:0;
  background:var(--accent, var(--brass));
  transition:width .8s cubic-bezier(.2,.6,.2,1) .1s;
  margin-bottom:24px;
}
.reveal.is-visible .accent-rule{width:64px;}

#services{--accent:var(--brass);}
#about{--accent:var(--teal);}
#books{--accent:var(--rust);}
#contact{--accent:var(--brass);}

/* Hover outlines — different colors by context, functional not decorative */
.service-row{
  position:relative;
  overflow:hidden;
  transition:border-color .2s, background-color .3s;
}
.service-row:hover{border-bottom-color:var(--brass);background-color:rgba(166,116,46,0.04);}
.row-icon{
  position:absolute;
  top:50%;
  right:-8px;
  transform:translateY(-50%);
  width:104px;
  height:104px;
  opacity:0.09;
  pointer-events:none;
  transition:opacity .3s, transform .3s;
  z-index:0;
}
.service-row:hover .row-icon{opacity:0.22;transform:translateY(-50%) scale(1.06);}
.service-row .num,
.service-row h3,
.service-row p{position:relative;z-index:1;}
@media(max-width:760px){
  .row-icon{width:72px;height:72px;right:-4px;}
}
.founder-photo-wrap{transition:border-color .2s;}
.founder-photo-wrap:hover{border-color:var(--teal);}
.book-cover-wrap{transition:border-color .2s,transform .2s;}
.book-cover-wrap:hover{border-color:var(--rust);transform:translateY(-4px);}

/* Books section */
.books-grid{
  display:grid;
  grid-template-columns:0.7fr 1.3fr;
  gap:56px;
  align-items:center;
}
@media(max-width:860px){
  .books-grid{grid-template-columns:1fr;gap:32px;}
}
.book-cover-wrap{
  border:1px solid var(--ink);
  padding:8px;
  max-width:280px;
}
.book-copy .kicker{
  font-size:13px;
  color:var(--rust);
  font-weight:500;
  margin-bottom:14px;
}
.book-copy h3{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:30px;
  margin-bottom:16px;
  max-width:14ch;
}
.book-copy p{
  color:var(--muted);
  margin-bottom:24px;
  max-width:48ch;
}
.book-list{
  margin-top:28px;
  border-top:1px solid var(--line);
  padding-top:20px;
}
.book-list-item{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  font-size:14.5px;
  color:var(--muted);
  border-bottom:1px solid var(--line);
}
.book-list-item span:first-child{color:var(--ink);}

/* Floating WhatsApp button */
.wa-float{
  position:fixed;
  bottom:24px;
  right:24px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:#25D366;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,0.25);
  z-index:100;
  animation:wa-pulse 2.6s ease-in-out infinite;
}
.wa-float svg{width:28px;height:28px;}
.wa-float:hover{animation-play-state:paused;}
@keyframes wa-pulse{
  0%,100%{box-shadow:0 6px 20px rgba(0,0,0,0.25),0 0 0 0 rgba(37,211,102,0.5);}
  50%{box-shadow:0 6px 20px rgba(0,0,0,0.25),0 0 0 10px rgba(37,211,102,0);}
}

/* Photographic section backgrounds */
.photo-section{
  position:relative;
  overflow:hidden;
  isolation:isolate;
}
.photo-section .bg-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:grayscale(100%) contrast(1.08);
  z-index:0;
}
.photo-section .bg-scrim{
  position:absolute;
  inset:0;
  z-index:1;
}
.photo-section > .wrap{
  position:relative;
  z-index:2;
}

.hero.photo-section{
  padding:120px 0 130px;
  border-bottom:none;
}
.hero.photo-section .bg-scrim{
  background:linear-gradient(100deg, rgba(20,24,28,0.94) 0%, rgba(20,24,28,0.82) 38%, rgba(20,24,28,0.55) 68%, rgba(20,24,28,0.35) 100%);
}
.hero.photo-section .eyebrow{color:var(--brass);}
.hero.photo-section h1{color:var(--paper);}
.hero.photo-section p.lede{color:rgba(245,242,234,0.75);}
.hero.photo-section .btn-secondary{border-color:var(--paper);color:var(--paper);}
.hero.photo-section .btn-secondary:hover{background:var(--paper);color:var(--ink);}
.hero.photo-section .index-list{
  background:rgba(245,242,234,0.08);
  backdrop-filter:blur(6px);
  border:1px solid rgba(245,242,234,0.18);
  border-top:1px solid rgba(245,242,234,0.18);
  padding:8px 20px;
}
.hero.photo-section .index-row{
  border-bottom:1px solid rgba(245,242,234,0.15);
}
.hero.photo-section .index-row:last-child{border-bottom:none;}
.hero.photo-section .index-row .label{color:rgba(245,242,234,0.75);}

/* Behind-the-build band */
.band{
  padding:80px 0;
}
.band .bg-scrim{
  background:linear-gradient(rgba(20,24,28,0.86),rgba(20,24,28,0.86));
}
.band-content{
  max-width:640px;
}
.band .kicker{
  font-size:13px;
  color:var(--brass);
  font-weight:500;
  margin-bottom:16px;
}
.band blockquote{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:500;
  font-size:clamp(22px,3vw,30px);
  color:var(--paper);
  line-height:1.35;
}
.band cite{
  display:block;
  margin-top:20px;
  font-style:normal;
  font-size:13px;
  color:rgba(245,242,234,0.6);
}

/* Contact with photo bg */
.contact.photo-section .bg-scrim{
  background:linear-gradient(100deg, rgba(20,24,28,0.95) 0%, rgba(20,24,28,0.88) 45%, rgba(20,24,28,0.62) 100%);
}
.contact.photo-section{background:var(--ink);}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  .reveal{opacity:1;transform:none;transition:none;}
  .accent-rule{width:64px;transition:none;}
  .wa-float{animation:none;}
}
</style>
</head>
